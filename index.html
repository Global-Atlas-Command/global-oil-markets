<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GOM</title>
</head>
<body>

<h2>Market State</h2>

<div><strong>Structure:</strong> <span id="structure"></span></div>
<div><strong>Products:</strong> <span id="products"></span></div>
<div><strong>Flows:</strong> <span id="flows"></span></div>
<div><strong>Balance:</strong> <span id="balance"></span></div>

<script>
fetch('/assets/data/market-state.json')
.then(res => res.json())
.then(d => {
  document.getElementById('structure').innerText = d.structure;
  document.getElementById('products').innerText = d.products;
  document.getElementById('flows').innerText = d.flows;
  document.getElementById('balance').innerText = d.balance;
});
</script>

</body>
</html>
