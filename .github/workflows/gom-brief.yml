name: GOM Automated Daily Brief

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenAI
        run: npm install --no-save openai

      - name: Generate GOM daily brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-gom-brief.mjs

      - name: Commit brief
        run: |
          git config user.name "gom-brief-bot"
          git config user.email "admin@globaloilmarkets.com"
          git add assets/data/briefs/
          git commit -m "Automated GOM daily brief" || echo "No changes"
          git pull --rebase origin main
          git push
